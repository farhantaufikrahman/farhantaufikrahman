# Draws the contribution graph as a snake animation and publishes it to the `output` branch.
# README reads the SVGs from that branch, so no third-party server is involved at view time.
name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Jakarta time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f0a000
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb524

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
